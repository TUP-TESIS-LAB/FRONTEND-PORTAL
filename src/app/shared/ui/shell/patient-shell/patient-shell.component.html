<div class="ui-patient-layout">

  <!-- Desktop: sidebar fija oscura -->
  <ui-sidebar
    [navGroups]="navGroups"
    [user]="user()"
    [tenant]="tenant()!"
    (logout)="logout()">
  </ui-sidebar>

  <!-- Mobile/tablet: mismo sidebar dentro de un drawer off-canvas -->
  <p-drawer
    [visible]="drawerOpen()"
    (visibleChange)="drawerOpen.set($event)"
    position="left"
    [style]="{ width: 'var(--ds-sidebar-w)', padding: '0' }"
    styleClass="ui-drawer">
    <ng-template pTemplate="headless">
      <ui-sidebar
        [navGroups]="navGroups"
        [user]="user()"
        [tenant]="tenant()!"
        (itemClick)="drawerOpen.set(false)"
        (logout)="logout()">
      </ui-sidebar>
    </ng-template>
  </p-drawer>

  <!-- Campanita: fija en la esquina, visible solo en mobile (sin topbar propio;
       en tablet vive en .ui-topbar__right, en desktop en .ui-sidebar__header). -->
  <button
    type="button"
    class="ui-notif-bell ui-notif-bell--mobile"
    aria-label="Notificaciones"
    (click)="openNotifications()">
    <i class="pi pi-bell"></i>
    @if (unreadCount() > 0) {
      <span class="ui-notif-bell__badge">{{ unreadCount() }}</span>
    }
  </button>

  <!-- Área principal: topbar + contenido con router-outlet -->
  <div class="ui-patient-layout__main">

    <!-- Topbar: visible solo en tablet (hamburguesa para abrir el menú + campanita) -->
    <header class="ui-topbar">
      <div class="ui-topbar__left">
        <p-button
          icon="pi pi-bars"
          [rounded]="true"
          [text]="true"
          ariaLabel="Abrir menú"
          (onClick)="drawerOpen.set(true)" />
      </div>
      <div class="ui-topbar__right">
        <button
          type="button"
          class="ui-notif-bell"
          aria-label="Notificaciones"
          (click)="openNotifications()">
          <i class="pi pi-bell"></i>
          @if (unreadCount() > 0) {
            <span class="ui-notif-bell__badge">{{ unreadCount() }}</span>
          }
        </button>
      </div>
    </header>

    <main class="ui-patient-content">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile: bottom navigation (app-like) -->
  <ui-bottom-nav
    [items]="mainNavItems"
    (moreClick)="moreSheetOpen.set(true)" />

  <!-- Mobile: bottom sheet con opciones secundarias (Mi perfil, Mi familia, Cerrar sesión) -->
  <ui-bottom-sheet
    [visible]="moreSheetOpen()"
    (visibleChange)="moreSheetOpen.set($event)"
    title="Más"
    [items]="moreSheetItems"
    (itemClick)="onMoreItemClick($event)" />

  <!-- Bandeja de notificaciones: se abre desde la campanita (desktop/tablet/mobile) -->
  <ui-top-sheet
    [visible]="notifOpen()"
    (visibleChange)="notifOpen.set($event)"
    title="Notificaciones"
    [items]="notifItems()" />

</div>
