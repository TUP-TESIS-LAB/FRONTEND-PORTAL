<div class="ui-fecha-hora-step" [class.ui-fecha-hora-step--stacked]="layout === 'stacked'">
  <div class="ui-fecha-hora-step__calendar">
    <h4>Seleccioná la fecha</h4>
    <p-datepicker
      [inline]="true"
      [minDate]="minDate"
      [ngModel]="fecha"
      (onSelect)="fechaChange.emit($event)" />
  </div>

  <div class="ui-fecha-hora-step__slots">
    <h4>Horarios disponibles</h4>
    @if (fecha) {
      <ui-time-slots
        [slots]="slots"
        [selectedHora]="selectedHora"
        [loading]="loading"
        (selectionChange)="horaChange.emit($event)" />
    } @else {
      <div class="ui-fecha-hora-step__placeholder">
        <i class="pi pi-calendar"></i>
        <p>Seleccioná un día para ver los horarios disponibles</p>
      </div>
    }
  </div>
</div>
