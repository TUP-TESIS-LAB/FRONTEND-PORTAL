<!-- role/tabindex solo cuando la card es interactiva (selección); si no, es contenido estático -->
<div
  class="family-card"
  [class.family-card--static]="!interactive"
  [attr.role]="interactive ? 'button' : null"
  [attr.tabindex]="interactive ? 0 : null"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()"
>
  <div class="avatar">{{ familiar.iniciales }}</div>
  <div class="info">
    <h4 class="name">{{ familiar.nombre }} {{ familiar.apellido }}</h4>
    <p class="meta">{{ familiar.vinculo }}{{ familiar.edad != null ? ' · ' + familiar.edad + ' años' : '' }}</p>

    @if (familiar.status === 'CREATED') {
      <p-tag
        value="Pendiente de verificación"
        severity="warn"
        styleClass="family-card__pending-badge"
      />
    }
  </div>

  @if (familiar.vinculo !== 'Yo') {
    <p-button
      label="Quitar"
      icon="pi pi-trash"
      severity="danger"
      [text]="true"
      size="small"
      styleClass="family-card__remove-btn"
      ariaLabel="Quitar a {{ familiar.nombre }} del grupo familiar"
      (onClick)="onRemoveClick($event)"
    />
  }
</div>
