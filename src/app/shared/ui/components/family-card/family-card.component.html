<button class="family-card" type="button" (click)="onClick()">
  <div class="content">
    <strong class="name">{{ familiar.nombre }} {{ familiar.apellido }}</strong>
    <span class="meta">{{ familiar.vinculo }} · {{ familiar.edad }} años</span>
  </div>
  <i class="pi pi-angle-right chevron"></i>
</button>
