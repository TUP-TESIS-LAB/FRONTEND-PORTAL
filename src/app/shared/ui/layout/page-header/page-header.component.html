<div class="ui-page-header">
  <div class="ui-page-header__text">
    <h1>{{ title }}</h1>
    @if (subtitle) {
      <p>{{ subtitle }}</p>
    }
  </div>
  <!--
    Slot para acción primaria (ej: botón "Sacar turno").
    El contenido proyectado se vuelve un flex-item de .ui-page-header,
    alineado a la derecha por justify-content: space-between.
    El padre controla visibilidad responsive con class="ui-show-desktop" en su botón.
  -->
  <ng-content />
</div>
