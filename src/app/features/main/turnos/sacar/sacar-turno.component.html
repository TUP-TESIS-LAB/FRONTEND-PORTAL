<p-toast [position]="bp.isMobile() ? 'top-center' : 'top-right'" />
<p-confirmDialog />

<!-- ─── Adaptive: drawer en mobile, dialog en desktop ─── -->

@if (bp.isMobile()) {
  <p-drawer
    [visible]="true"
    position="bottom"
    styleClass="ui-bottom-sheet-drawer ui-wizard-sheet">
    <ng-template pTemplate="headless">
      <ng-container [ngTemplateOutlet]="wizardContent" />
    </ng-template>
  </p-drawer>
} @else {
  <p-dialog
    [visible]="true"
    [modal]="true"
    [closable]="false"
    [closeOnEscape]="false"
    [showHeader]="false"
    [style]="{ width: '720px' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="ui-wizard-dialog">
    <ng-container [ngTemplateOutlet]="wizardContent" />
  </p-dialog>
}

<!-- ─── Contenido del wizard (compartido por dialog y drawer) ─── -->

<ng-template #wizardContent>
  <ui-wizard
    [steps]="steps()"
    [currentStep]="currentStep()"
    [canProceed]="canProceed()"
    confirmLabel="Confirmar turno"
    [loading]="saving()"
    (next)="onNext()"
    (back)="onBack()"
    (confirmed)="onConfirm()"
    (cancelled)="onCancel()">

    @switch (currentStepId()) {

      @case ('para-quien') {
        <app-step-para-quien
          [family]="family()"
          [selectedPatientId]="selectedPatientId()"
          (selectionChange)="selectedPatientId.set($event)" />
      }

      @case ('tipo') {
        <ui-analysis-card-grid
          [tipos]="tiposAnalisis()"
          [selectedIds]="selectedTipoIds()"
          (selectionChange)="selectedTipoIds.set($event)" />
      }

      @case ('sede') {
        <ui-sede-list
          [sedes]="sedes()"
          [selectedId]="selectedSedeId()"
          (selectionChange)="onSedeChange($event)" />
      }

      @case ('fecha') {
        <div class="ui-fecha-hora-step">
          <h4>Seleccioná la fecha</h4>
          <p-datepicker
            [inline]="true"
            [minDate]="minBookingDate"
            [(ngModel)]="fechaModel"
            (onSelect)="onFechaChange($event)" />

          @if (selectedFecha()) {
            <h4>Horarios disponibles</h4>
            <ui-time-slots
              [slots]="slots()"
              [selectedHora]="selectedHora()"
              [loading]="loadingSlots()"
              (selectionChange)="selectedHora.set($event)" />
          }
        </div>
      }

      @case ('confirmar') {
        <ui-turno-resumen
          [tipos]="selectedTipos()"
          [sede]="selectedSede()!"
          [fecha]="selectedFecha()!"
          [hora]="selectedHora()!"
          [requiereAyuno]="requiereAyuno()" />
      }

    }
  </ui-wizard>
</ng-template>
