<p-toast [position]="bp.isMobile() ? 'top-center' : 'top-right'" />
<p-confirmDialog />

<div class="ui-sacar-page">
  <header class="ui-sacar-page__header">
    <button type="button"
            class="ui-sacar-page__back-btn"
            (click)="onCancel()"
            aria-label="Volver a turnos">
      <i class="pi pi-arrow-left"></i>
    </button>
    <h1>Nuevo turno</h1>
  </header>

  <ui-wizard
    [steps]="steps()"
    [currentStep]="currentStep()"
    [canProceed]="canProceed()"
    confirmLabel="Confirmar turno"
    [loading]="saving()"
    (next)="onNext()"
    (back)="onBack()"
    (confirmed)="onConfirm()"
    (cancelled)="onCancel()">

    @switch (currentStepId()) {

      @case ('para-quien') {
        <app-step-para-quien
          [family]="family()"
          [selectedPatientId]="selectedPatientId()"
          (selectionChange)="selectedPatientId.set($event)" />
      }

      @case ('tipo') {
        <ui-analysis-card-grid
          [tipos]="tiposAnalisis()"
          [selectedIds]="selectedTipoIds()"
          (selectionChange)="selectedTipoIds.set($event)" />
      }

      @case ('sede') {
        <ui-sede-list
          [sedes]="sedes()"
          [selectedId]="selectedSedeId()"
          (selectionChange)="onSedeChange($event)" />
      }

      @case ('fecha') {
        <div class="ui-fecha-hora-step">
          <div class="ui-fecha-hora-step__calendar">
            <h4>Seleccioná la fecha</h4>
            <p-datepicker
              [inline]="true"
              [minDate]="minBookingDate"
              [(ngModel)]="fechaModel"
              (onSelect)="onFechaChange($event)" />
          </div>

          <div class="ui-fecha-hora-step__slots">
            <h4>Horarios disponibles</h4>
            @if (selectedFecha()) {
              <ui-time-slots
                [slots]="slots()"
                [selectedHora]="selectedHora()"
                [loading]="loadingSlots()"
                (selectionChange)="selectedHora.set($event)" />
            } @else {
              <div class="ui-fecha-hora-step__placeholder">
                <i class="pi pi-calendar"></i>
                <p>Seleccioná un día para ver los horarios disponibles</p>
              </div>
            }
          </div>
        </div>
      }

      @case ('confirmar') {
        <ui-turno-resumen
          [tipos]="selectedTipos()"
          [sede]="selectedSede()!"
          [fecha]="selectedFecha()!"
          [hora]="selectedHora()!"
          [requiereAyuno]="requiereAyuno()" />
      }

    }
  </ui-wizard>
</div>
