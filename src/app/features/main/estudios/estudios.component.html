<p-toast [position]="bp.isMobile() ? 'top-center' : 'top-right'" />

<ui-page-header
  title="Mis estudios"
  subtitle="Resultados disponibles para descargar." />

<!-- ─── Barra: paciente + orden (mismo patrón que Turnos) ─── -->
<div class="ui-estudios-filters">
  @if (patientFilterOptions().length > 1) {
    <div class="ui-estudios-filters__group">
      <span class="ui-estudios-filters__label ui-show-desktop">Paciente</span>
      <app-patient-filter
        [options]="patientFilterOptions()"
        [selectedId]="selectedPatientId()"
        (selectedIdChange)="selectedPatientId.set($event)" />
    </div>
  }

  <div class="ui-estudios-filters__group ui-estudios-filters__sort">
    <span class="ui-estudios-filters__label ui-show-desktop">Ordenar</span>
    <p-select
      [options]="sortOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Ordenar por"
      appendTo="body"
      [ngModel]="sortBy()"
      (ngModelChange)="onSortChange($event)"
      styleClass="ui-sort-select" />
  </div>
</div>

<!-- ─── Lista densa de estudios (documentos para descargar) ─── -->
<section class="ui-estudios-list">
  @if (loading()) {
    <div class="ui-estudios-panel">
      @for (i of [1, 2, 3, 4]; track i) {
        <p-skeleton height="40px" styleClass="ui-estudios-skeleton" />
      }
    </div>
  } @else if (estudiosFiltrados().length === 0) {
    <ui-empty-state
      icon="pi-file"
      heading="Aún no tenés estudios"
      message="Cuando tengas resultados disponibles van a aparecer acá." />
  } @else {
    <div class="ui-estudios-panel" role="list">
      @for (e of estudiosFiltrados(); track e.id) {
        <div class="ui-estudio-row" role="listitem">
          <span class="ui-estudio-row__icon" aria-hidden="true">
            <i class="pi pi-file"></i>
          </span>

          <div class="ui-estudio-row__info">
            <strong>{{ nombreEstudio(e) }}</strong>
            <span>{{ subtitulo(e) }}</span>
          </div>

          <p-tag
            class="ui-estudio-row__status"
            [value]="estadoLabel(e)"
            [styleClass]="'ui-tag-' + estadoClass(e)" />

          <p-button
            class="ui-estudio-row__download"
            icon="pi pi-download"
            [rounded]="true"
            [text]="true"
            ariaLabel="Descargar PDF"
            [pTooltip]="reporteDisponible(e) ? 'Descargar PDF' : 'Disponible próximamente'"
            tooltipPosition="left"
            [disabled]="!reporteDisponible(e)"
            (onClick)="onDescargar(e)" />
        </div>
      }
    </div>
  }
</section>
