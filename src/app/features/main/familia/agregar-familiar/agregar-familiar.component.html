<p-dialog
  [(visible)]="visible"
  header="Agregar familiar"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="ui-dialog-fullscreen-mobile"
  [breakpoints]="{ '768px': '100vw' }"
  [style]="{ width: '520px' }"
  (onHide)="onHide()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="af-form">

    <!-- Nombre -->
    <div class="af-field">
      <input
        id="firstName"
        pInputText
        formControlName="firstName"
        autocomplete="given-name"
        placeholder="Nombre *"
        aria-label="Nombre"
        class="af-input"
      />
    </div>

    <!-- Apellido -->
    <div class="af-field">
      <input
        id="lastName"
        pInputText
        formControlName="lastName"
        autocomplete="family-name"
        placeholder="Apellido *"
        aria-label="Apellido"
        class="af-input"
      />
    </div>

    <!-- DNI -->
    <div class="af-field">
      <input
        id="dni"
        pInputText
        formControlName="dni"
        inputmode="numeric"
        autocomplete="off"
        placeholder="DNI *"
        aria-label="DNI"
        class="af-input"
      />
    </div>

    <!-- Fecha de nacimiento -->
    <div class="af-field">
      <p-datepicker
        inputId="birthDate"
        formControlName="birthDate"
        [showIcon]="true"
        iconDisplay="input"
        [fluid]="true"
        appendTo="body"
        dateFormat="dd/mm/yy"
        [maxDate]="today"
        placeholder="Fecha de nacimiento"
        ariaLabel="Fecha de nacimiento"
        class="af-input"
      />
    </div>

    <!-- Género -->
    <div class="af-field">
      <p-select
        inputId="gender"
        formControlName="gender"
        [options]="genderOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Género"
        [showClear]="true"
        appendTo="body"
        class="af-input"
      />
    </div>

    <!-- Parentesco -->
    <div class="af-field">
      <p-select
        inputId="bond"
        formControlName="bond"
        [options]="bondOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Parentesco *"
        appendTo="body"
        class="af-input"
      />
    </div>

  </form>

  <ng-template pTemplate="footer">
    <div class="af-footer">
      <p-button
        label="Cancelar"
        [text]="true"
        severity="secondary"
        type="button"
        (onClick)="close()"
      />
      <p-button
        label="Agregar"
        severity="primary"
        type="submit"
        [disabled]="!canSubmit()"
        (onClick)="onSubmit()"
      />
    </div>
  </ng-template>
</p-dialog>
