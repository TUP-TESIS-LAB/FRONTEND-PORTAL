<ui-page-header
  [title]="cargando() ? 'Hola' : 'Hola, ' + nombrePaciente()"
  subtitle="Esto es lo que está pasando con tu cuenta." />

<!-- Banner de activación de notificaciones push: solo tras gesto explícito del usuario -->
@if (showPushBanner()) {
  <ui-notice-card
    icon="pi-bell"
    variant="info"
    title="Enterate cuando tus resultados estén listos"
    text="Activá las notificaciones y te avisamos apenas haya un informe nuevo." />
  <div class="ui-dashboard__push-actions">
    <p-button label="Activar notificaciones" (onClick)="activarNotificaciones()" />
    <p-button label="Ahora no" severity="secondary" [text]="true" (onClick)="dismissPushBanner()" />
  </div>
}

<!-- Hero: prioridad próximo turno → último estudio → empty state -->
@if (cargando()) {
  <p-skeleton height="180px" styleClass="ui-dashboard__skeleton" />
} @else if (proximoTurno(); as t) {
  <ui-hero-card
    label="Próximo turno"
    [title]="t.tipo"
    [details]="heroDetails()"
    [chips]="t.estudios"
    decorativeIcon="pi-calendar">
    <p-button
      label="Ver detalles"
      severity="secondary"
      (onClick)="onVerTurnos()" />
  </ui-hero-card>
} @else if (ultimoEstudio(); as e) {
  <ui-hero-card
    label="Último estudio"
    [title]="e.nombre ?? 'Estudio Nº ' + e.protocolId"
    [details]="estudioHeroDetails()"
    decorativeIcon="pi-file">
    <p-button
      label="Ver estudios"
      severity="secondary"
      (onClick)="onVerEstudios()" />
  </ui-hero-card>
} @else {
  <ui-placeholder-card
    icon="pi-calendar-plus"
    title="No tenés turnos próximos"
    description="Reservá tu próximo turno desde el botón Sacar turno." />
}

<!-- Accesos rápidos: cards grandes en grid -->
<section class="ui-dashboard__accesos">
  <h2 class="ui-dashboard__section-title">Accesos rápidos</h2>
  <div class="ui-accesos-grid">

    <button class="ui-acceso ui-acceso--primary" (click)="onSacarTurno()">
      <i class="pi pi-plus-circle"></i>
      <span class="ui-acceso__label">Sacar turno</span>
      <span class="ui-acceso__desc">Reservá una atención</span>
    </button>

    <button class="ui-acceso" (click)="onVerTurnos()">
      <i class="pi pi-calendar"></i>
      <span class="ui-acceso__label">Mis turnos</span>
      <span class="ui-acceso__desc">
        @if (turnosCount() > 0) {
          {{ turnosCount() }} próximo{{ turnosCount() === 1 ? '' : 's' }}
        } @else {
          Sin turnos próximos
        }
      </span>
    </button>

    <button class="ui-acceso" (click)="onVerEstudios()">
      <i class="pi pi-file"></i>
      <span class="ui-acceso__label">Mis estudios</span>
      <span class="ui-acceso__desc">Resultados y análisis</span>
    </button>

    <button class="ui-acceso" (click)="onVerFamilia()">
      <i class="pi pi-users"></i>
      <span class="ui-acceso__label">Mi familia</span>
      <span class="ui-acceso__desc">Gestioná tu grupo familiar</span>
    </button>

    <button class="ui-acceso" (click)="onVerPerfil()">
      <i class="pi pi-user"></i>
      <span class="ui-acceso__label">Mi perfil</span>
      <span class="ui-acceso__desc">Datos personales</span>
    </button>

  </div>
</section>
