<p-toast position="top-right" />

<ui-page-header
  title="Mi perfil"
  subtitle="Tus datos personales, cobertura e información médica.">
  <p-button
    label="Editar perfil"
    icon="pi pi-pencil"
    severity="primary"
    (onClick)="onEditar()" />
</ui-page-header>

<!-- Estado loading -->
@if (loading()) {
  <div class="ui-perfil__layout">
    <div><p-skeleton height="320px" /></div>
    <div><p-skeleton height="400px" /></div>
  </div>
} @else {
  <div class="ui-perfil__layout">

    <!-- Columna izquierda: hero + cobertura + datos críticos -->
    <div class="ui-perfil__sidebar">
      <ui-profile-summary
        [user]="user()!"
        (subirCredencial)="onSubirCredencial()" />
    </div>

    <!-- Columna derecha: 4 tabs con grupos de datos -->
    <div class="ui-perfil__content">
      <p-tabs value="datos-personales">
        <p-tablist>
          <p-tab value="datos-personales">Datos personales</p-tab>
          <p-tab value="contacto">Contacto</p-tab>
          <p-tab value="cobertura">Cobertura</p-tab>
          <p-tab value="datos-medicos">Datos médicos</p-tab>
        </p-tablist>

        <p-tabpanels>

          <!-- Datos personales -->
          <p-tabpanel value="datos-personales">
            <div class="ui-field-list">
              <ui-data-field
                icon="pi-user"
                label="Nombre completo"
                [value]="user()!.nombre + ' ' + user()!.apellido"
                [editable]="true"
                (edit)="onEditCampo('nombre completo')" />
              <ui-data-field
                icon="pi-id-card"
                label="DNI"
                [value]="user()!.dni" />
              <ui-data-field
                icon="pi-calendar"
                label="Fecha de nacimiento"
                [value]="user()!.fechaNac" />
              <ui-data-field
                icon="pi-hashtag"
                label="Edad"
                [value]="user()!.edad + ' años'" />
              <ui-data-field
                icon="pi-venus"
                label="Sexo"
                [value]="user()!.sexo" />
              <ui-data-field
                icon="pi-map-marker"
                label="Ciudad"
                [value]="user()!.ciudad"
                [editable]="true"
                (edit)="onEditCampo('ciudad')" />
            </div>
          </p-tabpanel>

          <!-- Contacto -->
          <p-tabpanel value="contacto">
            <div class="ui-field-list">
              <ui-data-field
                icon="pi-envelope"
                label="Email"
                [value]="user()!.email"
                [editable]="true"
                (edit)="onEditCampo('email')" />
              <ui-data-field
                icon="pi-phone"
                label="Teléfono"
                [value]="user()!.telefono"
                [editable]="true"
                (edit)="onEditCampo('teléfono')" />
              <ui-data-field
                icon="pi-map"
                label="Dirección"
                [value]="user()!.direccion || ''"
                [editable]="true"
                [multiline]="true"
                (edit)="onEditCampo('dirección')" />

              <h4 class="ui-grupo-titulo">Contacto de emergencia</h4>
              <ui-data-field
                icon="pi-user"
                label="Nombre"
                [value]="user()!.contactoEmergencia?.nombre || ''"
                [editable]="true"
                (edit)="onEditCampo('contacto de emergencia')" />
              <ui-data-field
                icon="pi-users"
                label="Vínculo"
                [value]="user()!.contactoEmergencia?.vinculo || ''"
                [editable]="true"
                (edit)="onEditCampo('contacto de emergencia')" />
              <ui-data-field
                icon="pi-phone"
                label="Teléfono de emergencia"
                [value]="user()!.contactoEmergencia?.telefono || ''"
                [editable]="true"
                (edit)="onEditCampo('contacto de emergencia')" />
            </div>
          </p-tabpanel>

          <!-- Cobertura -->
          <p-tabpanel value="cobertura">
            <div class="ui-field-list">
              <ui-data-field
                icon="pi-tag"
                label="Tipo de cobertura"
                [value]="user()!.cobertura.tipo" />
              <ui-data-field
                icon="pi-building"
                label="Obra social / Prepaga"
                [value]="user()!.cobertura.nombre"
                [editable]="true"
                (edit)="onEditCampo('cobertura')" />
              <ui-data-field
                icon="pi-star"
                label="Plan"
                [value]="user()!.cobertura.plan || ''"
                [editable]="true"
                (edit)="onEditCampo('cobertura')" />
              <ui-data-field
                icon="pi-hashtag"
                label="N° de afiliado"
                [value]="user()!.cobertura.afiliado || ''"
                [editable]="true"
                (edit)="onEditCampo('número de afiliado')" />
              <ui-data-field
                icon="pi-clock"
                label="Vencimiento"
                [value]="user()!.cobertura.venceEn || ''" />
            </div>
          </p-tabpanel>

          <!-- Datos médicos -->
          <p-tabpanel value="datos-medicos">
            <div class="ui-field-list">

              <h4 class="ui-grupo-titulo">Antecedentes</h4>
              <ui-data-field
                icon="pi-heart"
                label="Condiciones"
                [value]="user()!.datosMedicos.condiciones.length
                  ? user()!.datosMedicos.condiciones.join(', ')
                  : ''"
                [editable]="true"
                [multiline]="true"
                (edit)="onEditCampo('antecedentes')" />
              <ui-data-field
                icon="pi-bolt"
                label="Cirugías previas"
                [value]="user()!.datosMedicos.cirugiasPrevias.length
                  ? user()!.datosMedicos.cirugiasPrevias.join(', ')
                  : ''"
                [multiline]="true" />

              <h4 class="ui-grupo-titulo">Hábitos</h4>
              <ui-data-field
                icon="pi-ban"
                label="Tabaco"
                [value]="user()!.datosMedicos.habitos?.fuma || ''"
                [editable]="true"
                (edit)="onEditCampo('hábitos')" />
              <ui-data-field
                icon="pi-star-fill"
                label="Alcohol"
                [value]="user()!.datosMedicos.habitos?.alcohol || ''"
                [editable]="true"
                (edit)="onEditCampo('hábitos')" />
              <ui-data-field
                icon="pi-bolt"
                label="Actividad física"
                [value]="user()!.datosMedicos.habitos?.actividadFisica || ''"
                [editable]="true"
                (edit)="onEditCampo('hábitos')" />
              <ui-data-field
                icon="pi-calendar-clock"
                label="Última revisión"
                [value]="user()!.datosMedicos.ultimaRevision || ''" />

            </div>
          </p-tabpanel>

        </p-tabpanels>
      </p-tabs>
    </div>

  </div>

  <!-- Banner informativo inferior -->
  <div class="ui-perfil__banner">
    <i class="pi pi-shield ui-perfil__banner-icon"></i>
    <p class="ui-perfil__banner-text">
      Mantener esta información actualizada ayuda al laboratorio a interpretar mejor tus resultados.
    </p>
  </div>
}
