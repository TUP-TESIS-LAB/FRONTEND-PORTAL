<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ícono PWA white-label del producto (sin marca de ningún tenant).
    Glifo: tubo de ensayo con burbujas sobre el azul default del DS (#2563EB).
    Regenerar los PNG con: node tools/generate-pwa-icons.mjs
  -->
  <rect width="512" height="512" fill="#2563EB"/>
  <g transform="translate(256 264)">
    <!-- tubo -->
    <path d="M -52 -148
             h 104
             a 10 10 0 0 1 0 20
             h -10
             v 160
             a 42 42 0 0 1 -84 0
             v -160
             h -10
             a 10 10 0 0 1 0 -20
             z"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
    <!-- líquido -->
    <path d="M -42 -40
             h 84
             v 72
             a 42 42 0 0 1 -84 0
             z"
          fill="#FFFFFF" opacity="0.9"/>
    <!-- burbujas -->
    <circle cx="86" cy="-92" r="16" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="112" cy="-40" r="10" fill="#FFFFFF" opacity="0.65"/>
  </g>
</svg>
